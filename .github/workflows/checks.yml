name: Regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Run compact regression checks
        run: python tests/run_checks.py --browser --coverage
      - name: Add concise job summary
        if: always()
        shell: bash
        run: |
          if [ -f test-results/report.md ]; then
            cat test-results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: regression-report
          retention-days: 7
          path: |
            test-results/report.json
            test-results/report.md
            test-results/*.log
            test-results/*.png
